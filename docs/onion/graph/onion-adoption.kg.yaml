    verified_against: nao-verificado-gate-declarado-e-nao-provado
    label: "O gate está INSTALADO mas NÃO foi provado por execução nesta adoção"
    narrative: "Alvo sem commits, ou lint indisponível no momento. Instalar não é sinônimo de proteger: rode 'bash ops/verify-adopter-gate.sh <este-repo>' a partir do core, ou faça um commit que viole o lint de propósito e confirme que ele é BARRADO. Enquanto isto for open, a proteção deste repo é declarada, não verificada."
    provenance:
      source: "install-onion-githook.sh rodado na adoção (prova adiada)"
      locator: "hook nativo via core.hooksPath deste repo"
